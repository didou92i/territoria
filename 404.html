<style>
:root{--ink:#273247;--ink-2:#48556f;--muted:#66717f;--line:#e3e8ed;--wash:#eef6fb;--accent-dark:#246fa4;--accent-deeper:#1d5a86;--white:#fff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:linear-gradient(180deg,var(--wash) 0%,var(--white) 60%);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--accent-dark)}
a:focus-visible{outline:3px solid var(--accent-dark);outline-offset:3px;border-radius:4px}
main{flex:1;display:grid;place-items:center;padding:48px 16px}
.carte{max-width:560px;text-align:center}
.marque{display:inline-flex;align-items:center;gap:10px;color:#233c56;font-weight:750;font-size:21px;letter-spacing:-.8px;text-decoration:none;margin:0 0 28px}
.marque b{color:#328fcc;font-weight:750}
.code{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-dark);margin:0 0 10px}
h1{font-size:clamp(28px,4vw,40px);line-height:1.12;letter-spacing:-1px;margin:0 0 14px;color:#1f2b3e}
p{margin:0 0 28px;color:var(--ink-2)}
.btn{display:inline-flex;align-items:center;justify-content:center;border-radius:9px;padding:13px 20px;font-weight:650;font-size:16px;line-height:1.2;text-decoration:none;background:var(--accent-dark);color:#fff;border:1px solid var(--accent-dark)}
.btn:hover{background:var(--accent-deeper);border-color:var(--accent-deeper)}
footer{border-top:1px solid var(--line);padding:24px 16px 32px;color:var(--muted);font-size:14px;text-align:center}
footer p{margin:0;color:var(--muted)}
</style>
</head>
<body>
<main>
 <div class="carte">
  <a class="marque" href="/"><img src="/logo-tete.png" alt="" width="36" height="36"><span>Territor<b>IA</b></span></a>

 </div>
